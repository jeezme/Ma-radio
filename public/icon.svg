<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="speakerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="280" r="160" fill="url(#speakerGlow)"/>

  <!-- Radio Body -->
  <g filter="url(#shadow)">
    <!-- Main chassis -->
    <rect x="76" y="150" width="360" height="250" rx="36" fill="#182030" stroke="#334155" stroke-width="4"/>

    <!-- Antenna -->
    <line x1="120" y1="150" x2="190" y2="70" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="190" cy="70" r="10" fill="#f59e0b"/>

    <!-- Handle -->
    <path d="M 160 150 Q 160 110, 256 110 Q 352 110, 352 150" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round"/>

    <!-- Speaker Grille (Left) -->
    <circle cx="180" cy="275" r="75" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
    <circle cx="180" cy="275" r="55" fill="#090d16" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="180" cy="275" r="28" fill="url(#accent)"/>
    <circle cx="180" cy="275" r="10" fill="#ffffff"/>

    <!-- Dial / Frequency Display (Right Top) -->
    <rect x="280" y="185" width="130" height="70" rx="12" fill="#020617" stroke="#334155" stroke-width="2"/>
    <!-- Radio Waves in display -->
    <path d="M 296 220 Q 312 202, 328 220 T 360 220 T 392 220" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="345" cy="220" r="4" fill="#f43f5e"/>
    <text x="345" y="244" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MA RADIO</text>

    <!-- Tuning Knobs (Right Bottom) -->
    <g transform="translate(305, 315)">
      <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#475569" stroke-width="3"/>
      <line x1="0" y1="-20" x2="0" y2="-6" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(375, 315)">
      <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#475569" stroke-width="3"/>
      <line x1="0" y1="-20" x2="0" y2="-6" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Preset / Station indicators -->
    <circle cx="280" cy="365" r="5" fill="#10b981"/>
    <circle cx="305" cy="365" r="5" fill="#f59e0b"/>
    <circle cx="330" cy="365" r="5" fill="#f43f5e"/>
    <circle cx="355" cy="365" r="5" fill="#8b5cf6"/>
    <circle cx="380" cy="365" r="5" fill="#3b82f6"/>
  </g>

  <!-- Live on-air broadcast pulse rings -->
  <path d="M 390 120 A 45 45 0 0 1 435 165" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 405 105 A 65 65 0 0 1 470 170" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
</svg>
